<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div example</title>
    <style>
        .header{
            color:purple;
            background-color: aqua;
            padding:30px;
            border:2px solid black;
        }
        .menu{
            color:aqua;
            background-color: red;
            padding:30px;
            border:2px solid black;
        }
        .footer{
            color:brown;
            background-color: blueviolet;
            padding:30px;
            border:2px solid black;
        }
    </style>
</head>
<body>
    <div class="header">
       header section  
    </div>
    <div class="menu">
        navigation menu
    </div>
    <div class="footer">
        footer section
    </div>
</body>
</html>
