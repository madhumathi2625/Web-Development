<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquee</title>
</head>
<body>
    <marquee bgcolor="green" direction="down">hiii madhuuu!!!</marquee><br><br>
    <marquee bgcolor="blueviolet" direction="up">hiii madhuuu!!!</marquee><br><br>
    <marquee bgcolor="green" direction="left">hiii madhuuu!!!</marquee><br><br>
    <marquee bgcolor="blue" direction="right">hiii madhuuu!!!</marquee><br><br>
    <marquee bgcolor="green" direction="down" vspace="10">hiii madhuuu!!!</marquee><br><br>
    <marquee bgcolor="blue" direction="up" hspace="80">hiii madhuuu!!!</marquee><br><br>
    <br>
    <br>
    <marquee behavior="scroll">heyy madhumathiii</marquee>
    <marquee behavior="slide">heyy madhumathiii</marquee>
    <marquee behavior="alternate">heyy madhumathiii</marquee>
    <br>
    <br>
    <marquee loop="2">madhuuuu</marquee><br><br>
    <marquee width="50%">butterfly</marquee>
    <marquee direction="up" scrolldelay="50">helloo</marquee><br><br>
    <marquee direction="up" height="50%">heloo madhu</marquee>
    <marquee direction="down" scrollamount="50">heloo madhu</marquee>
    
</body>
</html>
