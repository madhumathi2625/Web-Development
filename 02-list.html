<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
    <h1>list example</h1>
    <h2>ordered list</h2>
<ol type="A">
    <li>html</li>
    <li>css</li>
    <li>javascript</li>
</ol>
<h2> unorderd list</h2>
<ul>
<li>python</li>
<li>api</li>
<li>ml</li>
</ul>
<h2>description list</h2>
<dl>
    <dt>html</dt>
    <dd>hyper text markup lang</dd>
    <dt>css</dt>
    <dd>cascading markup lang</dd>
</dl>
</body>
</html>
