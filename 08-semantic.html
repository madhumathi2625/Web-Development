<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>semantic html</title>
    <style>
        body{
            font-family: Arial;
            margin:0;
        }
        header{
            background-color: black;
            color:white;
            padding: 20px;
        }
        nav{
            background-color: #333;
            padding:15px;
        }
        nav a{
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }
        main{
            padding:20px;
        }
        section{
            margin-bottom: 30px;
        }
        article{
            border:1px solid grey;
            padding:15px;
        }
        aside{
            background: #f2f2f2;
            padding:15px;
        }
        footer{
            background: black;
            color:white;
            text-align: center;
            padding:20px;
        }
        .highlight{
            color:grey;

        }
    </style>
</head>
<body>
    <header>
        <h1>welcome to <span class="highlight">digital edify</span></h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#"> Courses</a>
        <a href="#"> Placements</a>
        <a href="#"> contact </a>
    </nav>
    <main>
        <section>
            <h2> our courses</h2>
            <p>
                python full stack,
                AI engineering,
                Data science
            </p>
        </section>
        <section>
            <h2> latest updates</h2>
            <article>
                <h3>new python batch started</h3>
                <p> python batch 2615 started with 26 students</p>
            </article>
        </section>
        <aside>
            <h3>
                upcoming workshops
            </h3>
            <p> agentic ai workshops this sunday</p>
        </aside>
    </main>
    <footer>
        <p> copy right 2026 digital edify</p>
    </footer>
</body>
</html>
