<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form validation</title>
</head>
<body>
    <form>
        <label>name</label>
        <input type="text" required ><br>
        <button>submit</button>
    </form><br>

    <form>
        <label>email</label><br>
        <input type="email" required><br>
        <button>click me </button><br><br>
    </form><br>

    <form>
        <label>username</label><br>
        <input type="text" minlength="9" required><br>
        <button>submit here</button><br><br>
    </form><br>

    <form>
        <label>firstname</label><br>
        <input type="text" maxlength="15" required><br>
        <button>click it</button><br><br>
    </form><br>

    <form>
        <label>phone number</label><br>
        <input type="number" min="18" max="15" requird><br>
        <button>saved it</button>
    </form>
</body>
</html>
