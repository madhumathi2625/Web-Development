<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product card</title>
    <style>
        .card{
            width:300px;
            border:1px solid red;
            padding:20px;
        }
        .price{
            color:green;
            font-size:25px;
            font-weight:25px;
        }
        .old_price{
            text-decoration: line-through;
            color:blueviolet;
        }
        .discount{
            color:aquamarine;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>iphone16</h2>
        <p>
            <span class="price">1100$</span><br>
            <span class="old_price">2000$</span><br>
            <span class="discount">10%  OFF</span><br>
        </p>
    </div>
</body>
</html>
