<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div example</title>
</head>
<body>
    <div>
        <h1>html</h1>
        <p>hyper text markup lang
        this is heading and paragraph div</p>
    </div><br>

    <div style="border:2px solid black;">
      this is a div border    
    </div><br>

    <div style="background-color: aqua;">
        this is background div
    </div><br>

    <div style="width:200px; height:200px; background-color:palevioletred;">
         this is height and width and background-color div
    </div><br>

    <div style="border:5px solid papayawhip; padding:20px;">
         padding div
    </div><br>

    <div style="border:5px solid red;margin:10px;">
        this is margin div
    </div><br>

    <div style="text-align:center;border:5px solid green">
        centred text
    </div>
</body>
</html>
