<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>span example</title>
    <style>
        .red{
            color:red;
        }
        .blue{
            color:blue;
        }
        .green{
            color:yellowgreen;
        }
    </style>
</head>
<body>
    <p>
        learning<span class="red">html</span>fun<br>
        learning<span class="blue">html</span>is fun<br>
        learning<span class="green">html</span>is fun<br>
    </p>
</body>
</html>
